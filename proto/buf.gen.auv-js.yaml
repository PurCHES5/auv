version: v2
inputs:
  - directory: .
    paths:
      - auv/api/daemon/v1
      - auv/api/driver/v1/display.proto
      - auv/api/driver/v1/input.proto
      - auv/api/transport/websocket/v1
plugins:
  - local: ../js/packages/auv-js/node_modules/.bin/protoc-gen-es
    out: ../js/packages/auv-js/src/gen
    # Service descriptors retain google.api.http extensions at runtime, so the
    # generated browser module graph must include their transitive definitions.
    include_imports: true
    opt:
      - target=ts
      - import_extension=none
