name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
    runs-on: ${{ matrix.os }}
    name: rust checks ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Buf
        uses: bufbuild/buf-action@v1
        with:
          version: "1.71.0"
          setup_only: true

      - name: Install yq
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install yq --version 4.53.3 --yes --no-progress

      - name: Generate vendored Protobuf dependencies
        shell: pwsh
        if: runner.os == 'Windows'
        run: ./scripts/generate-proto-vendor.ps1

      - name: Generate vendored Protobuf dependencies
        shell: bash
        if: runner.os != 'Windows'
        run: ./scripts/generate-proto-vendor

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libclang-dev \
            libxcb1-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libleptonica-dev \
            libtesseract-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo test
      - run: cargo run --quiet -- invoke --help
      - run: git diff --check
