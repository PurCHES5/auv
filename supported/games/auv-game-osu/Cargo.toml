[package]
name = "auv-game-osu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
tracing = ["dep:auv-runtime", "dep:auv-tracing"]

[dependencies]
auv-file = { path = "../../../crates/auv-file" }
auv-query-readiness = { path = "../../../crates/auv-query-readiness" }
auv-driver = { path = "../../../crates/auv-driver" }
auv-runtime = { path = "../../..", optional = true }
auv-task-object-detection = { path = "../../../crates/auv-task-object-detection" }
auv-tracing = { path = "../../../crates/auv-tracing", optional = true }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rosu-map = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
auv-driver-macos = { path = "../../../crates/auv-driver-macos" }

[dev-dependencies]
auv-tracing = { path = "../../../crates/auv-tracing", features = ["memory-store"] }
futures-executor = "0.3"

[[test]]
name = "integrated"
