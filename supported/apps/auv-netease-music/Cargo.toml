[package]
name = "auv-netease-music"
version.workspace = true
edition.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
tracing = ["auv-media-macos/tracing"]

[[bin]]
name = "auv-netease-music"
path = "src/bin/auv-netease-music.rs"
required-features = ["tracing"]

[dependencies]
auv-cli-common = { path = "../../../crates/auv-cli-common" }
auv-driver = { path = "../../../crates/auv-driver" }
# auv-media-macos compiles on all targets (non-macOS calls return Unsupported),
# so it is a normal dependency — this lets the platform-neutral CLI reuse its
# `MediaCommand` type instead of re-declaring it.
auv-media-macos = { path = "../../../crates/auv-media-macos" }
auv-view = { path = "../../../crates/auv-view" }
auv-tracing = { path = "../../../crates/auv-tracing", features = ["file-store"] }
clap = { version = "4.5", features = ["derive"] }
futures-executor = "0.3"
futures-util = { workspace = true, features = ["io"] }
serde.workspace = true
serde_json.workspace = true
image.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
auv-driver-macos = { path = "../../../crates/auv-driver-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
auv-driver-windows = { path = "../../../crates/auv-driver-windows" }
