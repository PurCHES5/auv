[package]
name = "auv-driver-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
overlay = ["dep:auv-driver-overlay"]

[dependencies]
auv-driver-common = { path = "../auv-driver-common" }
auv-driver-overlay = { path = "../auv-driver-overlay", features = ["macos"], optional = true }
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
swift-bridge.workspace = true
xcap.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-bridge-build.workspace = true
