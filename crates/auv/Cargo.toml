[package]
name = "auv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Domain-facing local and remote SDK facade for AUV"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
auv-api-client = { path = "../auv-api-client" }
auv-api-proto = { path = "../auv-api-proto" }
auv-driver = { path = "../auv-driver" }
auv-driver-overlay-common = { path = "../auv-driver-overlay-common" }
auv-media-macos = { path = "../auv-media-macos" }
directories = "6"
fs2.workspace = true
http = "1"
prost-types = "0.14"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tonic = { version = "0.14", features = ["transport"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
