[package]
name = "auv-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "Server-side SDK for hosting an AUV daemon"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
auv = { path = "../auv" }
auv-api-client = { path = "../auv-api-client" }
auv-api-proto = { path = "../auv-api-proto" }
auv-api-server = { path = "../auv-api-server" }
fs2.workspace = true
getrandom = "0.3"
hex.workspace = true
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
prost-types = "0.14"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-health = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid.workspace = true

[dev-dependencies]
futures-util.workspace = true
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
tempfile.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tonic-reflection = "0.14"
tokio-tungstenite = "0.29"
