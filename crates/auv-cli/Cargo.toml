[package]
name = "auv-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
description = "AUV product CLI and inspect assembly"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
autobins = false
default-run = "auv"

[[bin]]
name = "auv"
path = "src/bin/auv.rs"

[dependencies]
auv-runtime = { path = "../.." }
auv-cli-invoke-macros = { path = "../auv-cli-invoke-macros" }
auv-driver = { path = "../auv-driver" }
auv-driver-macos = { path = "../auv-driver-macos" }
auv-cli-invoke = { path = "../auv-cli-invoke" }
auv-api-proto = { path = "../auv-api-proto" }
auv-tracing = { path = "../auv-tracing", features = ["file-store"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }
tonic = { version = "0.14", features = ["transport"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true
swift-bridge-build.workspace = true

[dev-dependencies]
auv-api-proto = { path = "../auv-api-proto" }
auv-tracing = { path = "../auv-tracing", features = ["file-store", "memory-store"] }
axum = { version = "0.8", default-features = false }
rmcp = { version = "0.6", features = ["server", "client", "transport-io"] }
tempfile.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["transport"] }
tower = { version = "0.5", features = ["util"] }
